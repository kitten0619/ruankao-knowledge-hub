<script>
const MODULES_DATA = [{"id": "m1", "title": "模块1：统计学哲学基础", "markdown": "## 模块1：统计学哲学基础\n\n### 📋 核心要点速览\n> 现代数据分析有三大范式：**频率学派**（实证主义，长期频率，p值/置信区间）、**贝叶斯学派**（确证理论，主观信念度，后验分布/贝叶斯因子）、**数据科学/ML**（溯因推理+实用主义，预测优先）。三者根植于不同哲学传统，核心分歧不在\"概率是什么\"而在**优化目标**（平均情况 vs 最坏情况）。实践中推荐**混合策略**：贝叶斯建模 + 频率学派验证。\n\n### 🎯 关键概念卡片\n\n#### 三大范式对比\n| **维度** | **频率学派** | **贝叶斯学派** | **数据科学/ML** |\n|---|---|---|---|\n| 哲学根基 | 实证主义+实在论 | 确证理论 | 溯因推理+IBE |\n| 概率诠释 | 长期重复频率 | 主观信念度 | 优化工具 |\n| 参数观 | 固定未知常数 | 随机变量(有分布) | 视算法而定 |\n| 核心输出 | p值、置信区间 | 后验分布、BF | 预测值、特征重要性 |\n| 推理逻辑 | 归纳+演绎 | 归纳(贝叶斯更新) | 溯因→IBE |\n\n#### p值\n**定义**：在H₀为真时，获得当前或更极端结果的概率\n**易错点**：p值 ≠ H₀为真的概率 ≠ 效应大小。p=0.03不意味着H₀为真的概率是3%\n**要点**：\n- 20次独立检验(α=0.05)，至少1个假阳性概率≈64%\n- 过度依赖p值是复制危机的重要原因\n\n#### 贝叶斯因子(BF)\n**公式**：K = P(data|H₁) / P(data|H₀)\n**要点**：\n- 可**支持**零假设（p值做不到）\n- 量化证据强度，非二元决策\n\n#### Breiman的\"两种文化\"\n- **数据建模文化**：关注真实数据生成模型（线性回归等）\n- **算法建模文化**：只关心预测准确性（随机森林、SVM等）\n\n### 📊 核心对比表：平均情况 vs 最坏情况\n| **维度** | **贝叶斯** | **频率学派** |\n|---|---|---|\n| 核心目标 | 优化平均情况性能 | 优化最坏情况性能 |\n| 比喻 | 精明投资者 | 谨慎工程师 |\n| 关键输入 | 先验分布 p(θ) | 数据生成假设 |\n| 决策依据 | 后验期望效用最大化 | 最坏情况损失最小化 |\n\n### 🔑 重点公式\n- **MLE（频率学派）**：θ̂_MLE = argmax P(data|θ)\n- **贝叶斯定理**：π(θ|data) ∝ P(data|θ) · π(θ)\n- **经验风险最小化（ML）**：f̂ = argmin (1/n)ΣL(yᵢ, f(xᵢ))\n\n### ✅ 自检清单\n- [ ] 能否区分三大范式的哲学根基和概率诠释？\n- [ ] 能否解释p值的正确含义及常见误读？\n- [ ] 能否说明\"平均情况 vs 最坏情况\"的根本分歧？\n- [ ] 能否根据场景选择合适的方法论（决策流程）？\n- [ ] 能否解释混合策略的核心思想？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（14,438 字）"}, {"id": "m2", "title": "模块2：统计学核心概念", "markdown": "## 模块2：统计学核心概念\n\n### 📋 核心要点速览\n> 统计学核心四大支柱：**描述统计**（集中趋势+离散程度+分布形态）、**概率论**（三大公理+贝叶斯定理+常见分布）、**推断统计**（CLT→置信区间→假设检验）、**实验设计**（随机化+控制+重复）。关键认知：p值≠效应量，统计显著≠实际重要，必须同时报告效应量。\n\n### 🎯 关键概念卡片\n\n#### 集中趋势与离散程度\n| **指标** | **特点** | **适用** |\n|---|---|---|\n| 均值 | 对异常值**敏感** | 对称分布 |\n| 中位数 | 对异常值**稳健** | 偏态分布(收入/房价) |\n| 标准差 | 与原始数据同单位 | 最常用离散度量 |\n| IQR | 抗异常值，反映中间50% | 偏态数据 |\n\n**为何用n-1**：样本方差用n-1得到总体方差的**无偏估计**\n\n#### 中心极限定理(CLT)\n**核心**：n≥30时，样本均值近似正态分布，**无论总体分布**\n- 形状：近似正态 | 中心：μ_x̄ = μ | 尺度：SE = σ/√n\n- n增加4倍 → SE减半\n\n#### 置信区间 vs 可信区间\n| **类型** | **频率学派(置信区间)** | **贝叶斯(可信区间)** |\n|---|---|---|\n| 解释 | 参数固定，区间随机 | 参数随机，区间固定 |\n| 表述 | \"方法长期95%覆盖参数\" | \"参数95%概率在此区间\" |\n\n#### 假设检验核心\n- **p值** = P(数据|H₀为真)，**不是** P(H₀为真|数据)\n- **两类错误**：Type I (α, 错误拒绝) / Type II (β, 错误保留)\n- **Power = 1-β**：正确拒绝H₀的概率，受样本量、效应量、α影响\n\n#### 效应量必备\n| **效应量** | **小/中/大** | **适用** |\n|---|---|---|\n| Cohen's d | 0.2/0.5/0.8 | 两组均值比较 |\n| η²/ω² | 0.01/0.06/0.14 | ANOVA |\n| Cramer's V | 0.10/0.30/0.50 | 卡方检验 |\n\n### 🔑 重点公式\n- **Z分数**：z = (x - μ) / σ\n- **标准误**：SE = σ / √n\n- **CLT置信区间**：x̄ ± z_{α/2} × σ/√n\n- **贝叶斯定理**：P(A|B) = P(B|A)·P(A) / P(B)\n- **医学检测实例**：患病率0.1%，灵敏度99%，特异度95% → P(患病|阳性) ≈ 1.9%\n\n### ✅ 自检清单\n- [ ] 能否区分均值vs中位数的适用场景？\n- [ ] 能否正确解释置信区间的含义（频率学派vs贝叶斯）？\n- [ ] 能否说明p值的正确定义和三种常见误读？\n- [ ] 能否计算CLT相关的概率问题？\n- [ ] 能否区分Type I和Type II错误及影响因素？\n- [ ] 能否解释为什么必须报告效应量？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（16,118 字）"}, {"id": "m3", "title": "模块3：经典统计方法", "markdown": "## 模块3：经典统计方法\n\n### 📋 核心要点速览\n> 六大经典方法：**t检验家族**（单样本/独立/配对）比较均值差异、**ANOVA**（单因素/双因素/重复测量）比较多组均值、**线性回归**建立连续变量关系、**逻辑回归**处理二分类、**卡方检验**分析分类变量关联、**分类器评估**衡量预测性能。核心逻辑：选方法看数据类型（连续/分类）和组数（1/2/3+）。\n\n### 🎯 关键概念卡片\n\n#### t检验家族\n| **类型** | **场景** | **H₀** | **额外假设** |\n|---|---|---|---|\n| 单样本 | 样本vs已知均值 | μ = μ₀ | 正态性 |\n| 独立样本 | 两组均值比较 | μ₁ = μ₂ | 正态+方差齐(Levene) |\n| 配对样本 | 前后测/匹配 | μ_D = 0 | 差值正态 |\n**方差不齐** → Welch t检验 | **违反正态** → 非参数替代(Mann-Whitney U / Wilcoxon)\n\n#### ANOVA\n- **F = MS_between / MS_within**：组间变异 vs 组内变异\n- **双因素**：可考察主效应 + 交互效应(A×B)\n- **球形假设**（重复测量）：违反用Greenhouse-Geisser校正\n- **事后检验**：Tukey(方差齐) / Games-Howell(方差不齐) / Bonferroni(最保守)\n- **效应量**：偏η² = SS_between / (SS_between + SS_within)\n\n#### 线性回归\n- **模型**：Y = β₀ + β₁X + ε，OLS最小化RSS\n- **R²** = 1 - RSS/TSS（决定系数），**调整R²**惩罚多余变量\n- **诊断问题**：非线性/异方差/共线性(VIF>10)/异常值(Cook's D)\n- **变量选择**：最优子集 / 逐步法 / AIC-BIC\n\n#### 逻辑回归\n- **模型**：P(Y=1) = 1/(1+e^{-(β₀+β₁X)})，用MLE估计\n- **OR = e^β₁**：OR=1无关联，OR>1正向，OR<1负向\n- **评估**：混淆矩阵→准确率/精确率/召回率/F1\n\n#### 分类器评估\n| **指标** | **公式** | **侧重** |\n|---|---|---|\n| 精确率 | TP/(TP+FP) | 预测为正中多少对的 |\n| 召回率 | TP/(TP+FN) | 实际为正中检出多少 |\n| F1 | 2PR/(P+R) | 不平衡数据 |\n| ROC-AUC | 曲线下方积 | 整体分类能力 |\n\n### 🔑 重点公式\n- **t统计量**：t = (x̄ - μ₀) / (s/√n)\n- **F统计量**：F = MS_B / MS_W\n- **R²**：1 - RSS/TSS\n- **χ²**：Σ(O-E)²/E，期望频数<5用Fisher精确检验\n\n### ✅ 自检清单\n- [ ] 能否根据数据类型和研究问题选择合适的检验方法？\n- [ ] 能否区分三种t检验的适用条件和假设？\n- [ ] 能否解释ANOVA中主效应与交互效应的区别？\n- [ ] 能否解读逻辑回归的OR值？\n- [ ] 能否画出混淆矩阵并计算各评估指标？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（21,618 字）"}, {"id": "m4", "title": "模块4：贝叶斯统计", "markdown": "## 模块4：贝叶斯统计\n\n### 📋 核心要点速览\n> 贝叶斯统计的核心是**信念更新**：先验 + 数据 → 后验。关键要素：**先验选择**（无信息/弱信息/有信息+共轭先验）、**后验推断**（点估计+可信区间+预测）、**贝叶斯因子**（假设检验+模型比较）、**MCMC计算**（当后验无解析解时）。应用涵盖贝叶斯t检验、ANOVA、回归、逻辑回归。\n\n### 🎯 关键概念卡片\n\n#### 贝叶斯定理\n**公式**：P(θ|D) = P(D|θ)·P(θ) / P(D) → **后验 ∝ 似然 × 先验**\n**要点**：\n- 后验 → 新先验 → 持续更新（递推性）\n- 大样本时先验被\"冲销\"，后验收敛于频率学派估计\n\n#### 先验分布三类型\n| **类型** | **代表** | **特点** |\n|---|---|---|\n| 无信息 | 均匀/Jeffreys | 最少假设，客观 |\n| 弱信息 | 高方差正态/JZS柯西 | 正则化，防极端估计 |\n| 有信息 | 共轭先验/经验贝叶斯 | 融入领域知识 |\n\n#### 三大共轭先验组合\n| **组合** | **数据** | **后验更新** |\n|---|---|---|\n| Beta-Binomial | 二项(硬币/转化率) | α+s, β+n-s |\n| Gamma-Poisson | 计数(来电/事件率) | α+Σx, β+n |\n| Normal-Normal | 正态(方差已知) | 精度加权平均 |\n\n#### 贝叶斯因子(BF)\n- **BF₁₀ > 1**：数据支持H₁ | **BF₁₀ < 1**：数据支持H₀\n- Jeffreys标度：1-3微弱, 3-10实质性, 10-30强, >30极强\n- **优势**：可支持H₀（p值做不到）\n\n#### MCMC方法\n- **问题**：复杂模型的后验无解析解，需数值近似\n- **Metropolis-Hastings**：提议分布→接受/拒绝→马尔可夫链收敛于后验\n- **Gibbs采样**：MH特例，逐参数条件采样\n- **诊断**：轨迹图(混合良好)、自相关图(低相关)、R̂≈1\n\n### 📊 贝叶斯 vs 频率学派方法对比\n| **方法** | **频率学派** | **贝叶斯** |\n|---|---|---|\n| t检验 | p值、置信区间 | 后验分布、BF、可信区间 |\n| ANOVA | F统计量、η² | 后验效应量、BF |\n| 回归 | OLS、R²、p值 | 后验系数分布、可信区间 |\n| 模型比较 | AIC/BIC | BF（直接比较边际似然） |\n\n### 🔑 重点公式\n- **贝叶斯定理**：π(θ|D) ∝ L(θ|D)·π(θ)\n- **Beta-Binomial后验**：Beta(α+s, β+n-s)\n- **BF**：BF₁₀ = P(D|H₁) / P(D|H₀)\n- **可信区间**：直接说\"参数95%概率在此区间\"\n\n### ✅ 自检清单\n- [ ] 能否解释贝叶斯更新的递推过程？\n- [ ] 能否区分三种先验类型的适用场景？\n- [ ] 能否计算Beta-Binomial共轭后验？\n- [ ] 能否解释BF相比p值的优势？\n- [ ] 能否说明MCMC的基本思想和诊断方法？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（34,271 字）"}, {"id": "m5", "title": "模块5：统计学习", "markdown": "## 模块5：统计学习\n\n### 📋 核心要点速览\n> 统计学习 = 用数据估计f(X)来预测Y。**核心框架**：偏差-方差权衡（模型复杂度↑→偏差↓方差↑）。**方法谱系**：线性回归→正则化(Ridge/Lasso)→树方法(Bagging/RF/Boosting)→SVM→PCA→深度学习。**评估工具**：交叉验证(选模型)、Bootstrap(估不确定性)。核心原则：测试误差才是真性能。\n\n### 🎯 关键概念卡片\n\n#### 偏差-方差权衡\n**公式**：Err(x₀) = Bias² + Variance + σ²(不可约)\n- **偏差↑**：欠拟合（模型太简单）\n- **方差↑**：过拟合（模型太灵活）\n- 最优模型在两者之和最小处\n\n#### 交叉验证\n| **方法** | **偏差** | **方差** | **计算** |\n|---|---|---|---|\n| 验证集 | 中 | 高(依赖划分) | O(1) |\n| LOOCV | 极低 | 高 | O(n) |\n| k-fold(k=5/10) | 稍高 | 低 | O(k) ← **推荐** |\n\n#### 正则化方法\n| **方法** | **惩罚** | **特点** |\n|---|---|---|\n| Ridge(L2) | λΣβⱼ² | 收缩系数，不置零 |\n| Lasso(L1) | λΣ|βⱼ| | 可做**特征选择**(稀疏解) |\n| Elastic Net | α·L1 + (1-α)·L2 | 兼顾两者 |\n\n#### 树方法\n| **方法** | **核心思想** | **优缺点** |\n|---|---|---|\n| Bagging | 自助聚合，降低方差 | 好但不可解释 |\n| Random Forest | Bagging+随机选特征 | 更robust |\n| Boosting | 序贯拟合残差，降偏差 | 强但需调参 |\n\n#### SVM\n- **最大间隔分类器**：找最大分隔超平面\n- **核技巧**：高维映射解决非线性（RBF核最常用）\n- **关键参数**：C(正则化)、γ(核宽度)\n\n#### PCA\n- 正交变换→主成分(方差最大方向)\n- 用途：降维、去相关、可视化\n- 注意：需标准化，丢失可解释性\n\n### 🔑 重点公式\n- **测试MSE分解**：Bias² + Variance + σ²\n- **Ridge目标**：min RSS + λΣβⱼ²\n- **Lasso目标**：min RSS + λΣ|βⱼ|\n- **k-fold CV**：CV = (1/k)ΣMSEᵢ\n\n### ✅ 自检清单\n- [ ] 能否画出偏差-方差权衡图并解释？\n- [ ] 能否区分Ridge和Lasso的适用场景？\n- [ ] 能否解释RF和Boosting的区别？\n- [ ] 能否说明SVM核技巧的直觉？\n- [ ] 能否选择合适的CV方法并解释原因？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（57,765 字）"}, {"id": "m6", "title": "模块6：数据可视化", "markdown": "## 模块6：数据可视化\n\n### 📋 核心要点速览\n> 数据可视化 ≠ 画图，是**数据驱动的探索与展示**。核心原则：Tufte的数据墨水比最大化、图表垃圾最小化。图表选择取决于数据类型（分类/连续）和分析目标（分布/关系/比较/组成）。关键技能：EDA+残差诊断、多维可视化(散点图矩阵/平行坐标)、静态vs动态可视化的场景选择。\n\n### 🎯 关键概念卡片\n\n#### Tufte核心原则\n- **数据墨水比** = 用于数据的墨水/总墨水量 → **最大化**\n- **图表垃圾最小化**：去3D效果、阴影、装饰\n- **诚实性**：不截断坐标轴、不用面积表一维数据\n\n#### 图表选择指南\n| **目的** | **推荐图表** |\n|---|---|\n| 分布 | 直方图、箱线图、小提琴图、密度图 |\n| 比较 | 条形图、箱线图、点图 |\n| 关系 | 散点图、气泡图、热力图 |\n| 组成 | 堆叠面积图、饼图(≤5类)、树图 |\n| 趋势 | 折线图、面积图 |\n\n#### Anscombe四重奏\n四组数据统计摘要完全相同(均值/方差/r/回归线)，但散点图形态完全不同\n→ **结论**：相同统计量可掩盖截然不同的数据故事\n\n#### 多维可视化技术\n| **方法** | **原理** | **限制** |\n|---|---|---|\n| 散点图矩阵 | 所有变量两两散点 | 变量多时拥挤 |\n| 平行坐标 | 每变量一条垂直轴 | 交叉线多时难读 |\n| 颜色/大小/形状编码 | 在2D图上叠加维度 | 维度≤4有效 |\n\n#### 残差诊断图\n- **残差vs拟合值**：检查线性+方差齐性(应无模式)\n- **Q-Q图**：检查正态性(点贴近对角线)\n- **Scale-Location图**：检查方差齐性\n- **残差vs杠杆**：识别强影响点(Cook's D)\n\n### ✅ 自检清单\n- [ ] 能否根据数据类型和分析目标选择合适图表？\n- [ ] 能否解释Tufte的数据墨水比原则？\n- [ ] 能否说明Anscombe四重奏的启示？\n- [ ] 能否正确解读四种残差诊断图？\n- [ ] 能否区分静态vs动态可视化的适用场景？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（24,778 字）"}, {"id": "m7", "title": "模块7：统计工具与计算环境", "markdown": "## 模块7：统计工具与计算环境\n\n### 📋 核心要点速览\n> 工具选择**问题驱动**，不被\"雏鸭综合征\"限制。六大工具各有优势：JASP(教学+贝叶斯)、Python(ML生态)、R(统计推断+可视化)、SAS(企业合规)、SPSS(行为科学入门)、Tableau(商业BI)。核心能力：Python的NumPy/Pandas数据处理、可重复性工作流(Git+R Markdown/Jupyter)。\n\n### 🎯 关键概念卡片\n\n#### 工具全景对比\n| **工具** | **核心优势** | **适用场景** |\n|---|---|---|\n| **JASP** | 免费，同时输出频率+贝叶斯 | 教学、贝叶斯分析 |\n| **Python** | ML生态最强(scikit-learn) | 机器学习、数据科学 |\n| **R** | 统计推断最完善，ggplot2 | 学术研究、定制分析 |\n| **SAS** | 企业级可靠性，FDA认可 | 受监管行业、大规模分析 |\n| **SPSS** | 菜单操作，用户友好 | 行为科学、教学入门 |\n| **Tableau** | 拖放式仪表板 | 商业报告、数据展示 |\n\n#### Python统计生态\n| **库** | **用途** |\n|---|---|\n| numpy | 数值计算、数组 |\n| pandas | DataFrame处理 |\n| scipy.stats | 统计检验 |\n| statsmodels | 回归建模 |\n| scikit-learn | ML(分类/聚类/评估) |\n| matplotlib/seaborn | 可视化 |\n\n#### NumPy核心\n- **ndarray**：同质多维数组，向量化运算\n- **广播机制**：不同形状数组运算的规则\n- **常用函数**：np.mean/sum/std/reshape/random\n\n#### Pandas核心\n- **DataFrame**：异构表格数据，带行列标签\n- **核心操作**：筛选(loc/iloc)、分组(groupby)、合并(merge)、透视(pivot_table)\n- **数据清洗**：缺失值(fillna/dropna)、类型转换、字符串方法\n\n#### 开源vs商业\n| **维度** | **开源** | **商业** |\n|---|---|---|\n| 成本 | 免费(隐性:维护) | 付费(含支持) |\n| 灵活性 | 高 | 低 |\n| 合规 | 需自验 | FDA等认可 |\n\n### 🔑 关键操作\n- **可重复性**：脚本>菜单操作，Git版本控制，conda/renv环境管理\n- **JASP流程**：导入→定义变量→拖放分析→解读\n- **数据分析流程**：收集→清洗→EDA→建模→可视化→报告(迭代)\n\n### ✅ 自检清单\n- [ ] 能否根据场景选择合适的统计工具？\n- [ ] 能否用NumPy进行基本数组运算？\n- [ ] 能否用Pandas进行数据清洗和分组操作？\n- [ ] 能否解释可重复性研究的重要性及实现方式？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（89,445 字）"}, {"id": "m8", "title": "模块8：高级统计建模与机器学习", "markdown": "## 模块8：高级统计建模与机器学习\n\n### 📋 核心要点速览\n> DSCI6200核心：从传统统计思维转向**数据科学思维**——从\"只看p值\"到\"根据问题选工具、根据数据验模型、根据效果释结论\"。课程三大主线：①传统假设检验的12个缺点②数据科学/ML/AI概念建构③数字化转型下的大数据优势与伦理风险。高级方法涵盖集成学习(XGBoost)、SVM、LDA、神经网络。\n\n### 🎯 关键概念卡片\n\n#### 传统假设检验的核心局限\n- **不直接回答处理效果**：p值≠效果大小，大样本可使微小差异\"显著\"\n- **容易拒绝H₀**：弱对照组+大样本 → 伪发现\n- **不区分实际/统计显著**：需报告效应量+CI\n- **可重复性危机**：p-hacking、HARKing(先知道结果再写假设)\n- **固定样本限制**：不能中途看数据(贝叶斯可以)\n\n#### 数据科学思维 vs 传统统计\n| **维度** | **传统统计** | **数据科学** |\n|---|---|---|\n| 目标 | 检验假设、参数估计 | 预测、模式识别 |\n| 流程 | 预设→检验→结论 | 探索→建模→迭代 |\n| 评估 | p值、R² | 测试误差、交叉验证 |\n| 大样本 | 更\"显著\" | 更复杂模型可行 |\n\n#### 集成学习\n| **方法** | **核心** | **特点** |\n|---|---|---|\n| Bagging | 自助聚合，降方差 | 并行训练 |\n| Random Forest | +随机特征选择 | 更robust |\n| Boosting | 序贯拟合残差，降偏差 | XGBoost/LightGBM |\n| Stacking | 多层模型组合 | 灵活但复杂 |\n\n#### LDA(线性判别分析)\n- **思想**：找投影方向使类间距离最大、类内距离最小\n- vs PCA：LDA有监督(用类别标签)，PCA无监督\n- 假设：各类协方差矩阵相等\n\n#### SVM(支持向量机)\n- **核心**：最大间隔超平面 + 核技巧\n- **软间隔**：允许误分类(C参数控制)\n- **核函数**：线性→多项式→RBF(最通用)\n\n#### 神经网络基础\n- **结构**：输入→隐藏层(激活函数)→输出\n- **反向传播**：链式法则计算梯度，更新权重\n- **过拟合防控**：Dropout、早停、正则化\n\n### 🔑 重点概念\n- **大数据优势**：扩大观察范围、降低获取成本、捕捉行为足迹\n- **大数据风险**：隐私泄露、算法偏差、伪相关、\"显著性过剩\"\n- **数字化转型**：同时看到技术优势和伦理风险\n\n### ✅ 自检清单\n- [ ] 能否列举传统假设检验的至少5个缺点？\n- [ ] 能否区分数据科学思维与传统统计思维的差异？\n- [ ] 能否解释Bagging vs Boosting的原理和区别？\n- [ ] 能否说明LDA与PCA的区别？\n- [ ] 能否解释大数据的双面性(优势+风险)？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（62,268 字）"}, {"id": "m9", "title": "模块9：数据可视化理论与实践", "markdown": "## 模块9：数据可视化理论与实践\n\n### 📋 核心要点速览\n> DSCI6300系统覆盖数据可视化从理论到实践的完整链条：**EDA探索**→**设计原则**(Tufte/Gestalt/颜色理论)→**图表类型与选择**→**多维可视化技术**→**交互与动态可视化**→**可视化评估与改进**。核心理念：可视化服务于认知，每个设计决策都应有认知科学依据。\n\n### 🎯 关键概念卡片\n\n#### 可视化设计三大理论基础\n| **理论** | **核心原则** | **应用** |\n|---|---|---|\n| **Tufte** | 数据墨水比最大化、去图表垃圾 | 简洁、诚实 |\n| **Gestalt** | 接近性/相似性/连续性/闭合性 | 分组、布局 |\n| **颜色理论** | 分类用质性色、连续用序列色、发散用双色 | 编码、强调 |\n\n#### Gestalt格式塔原则\n- **接近性**：靠近的元素被视为一组\n- **相似性**：颜色/形状/大小相同的元素归为一组\n- **连续性**：眼睛倾向于沿平滑路径追踪\n- **闭合性**：自动补全不完整图形\n- **应用**：图表布局、图例设计、多子图排列\n\n#### 颜色使用规范\n| **数据类型** | **色带类型** | **示例** |\n|---|---|---|\n| 分类(名义) | 质性色带(差异明显) | Set1, Category10 |\n| 连续(有序) | 序列色带(渐变) | Blues, Viridis |\n| 连续(有中心值) | 发散色带(双色) | RdBu, 冷-暖 |\n- **色盲友好**：避免红绿对比，用蓝橙替代\n- **彩虹色带**：不推荐(感知不均匀、色盲不友好)\n\n#### EDA核心实践\n- **单变量**：直方图→密度图→箱线图(看分布/异常值)\n- **双变量**：散点图→相关系数→趋势线\n- **多变量**：散点图矩阵→平行坐标→颜色编码\n- **残差分析**：残差vs拟合(线性+齐性)、Q-Q(正态性)\n\n#### 交互可视化设计\n- **Shneiderman mantra**：概览优先，缩放过滤，按需详情\n- **交互原语**：平移/缩放/刷选/悬停/联动\n- **工具**：Tableau(商业)、Plotly/D3.js(编程)、JMP(教学)\n\n#### 可视化评估标准\n| **维度** | **检查点** |\n|---|---|\n| 准确性 | 数据如实呈现，无误导缩放 |\n| 清晰性 | 信息层次分明，无歧义 |\n| 效率性 | 最少视觉元素传达最多信息 |\n| 美观性 | 专业配色、合理留白 |\n| 可访问性 | 色盲友好、标注清晰 |\n\n### 🔑 实践要点\n- **残差分析流程(JMP)**：打开数据→Fit Y by X→拟合回归线→Plot Residuals→密度椭圆检异常值→排除后重新拟合→对比前后残差分布\n- **图表选择三步法**：①确定分析目的 ②识别变量类型 ③选择匹配图表\n- **多维数据降维展示**：分面(facet)、颜色编码、交互筛选\n\n### ✅ 自检清单\n- [ ] 能否运用Gestalt原则解释图表布局？\n- [ ] 能否为不同数据类型选择合适的颜色编码？\n- [ ] 能否正确执行EDA流程(单变量→双变量→多变量)？\n- [ ] 能否解释Shneiderman的可视化交互mantra？\n- [ ] 能否从五个维度评估一个可视化的质量？\n\n---\n\n---\n", "is_refined": false, "has_original": true, "original_summary": "📖 展开完整纪要原文（620,713 字）"}, {"id": "dsci6400_full", "title": "AI伦理学 · 完整笔记", "markdown": "# DSCI6400 人工智能中的伦理学 · 系统化学习笔记\n\n> **课程信息**：HPU 夏威夷太平洋大学 · AI硕士项目\n> **学习周期**：Week 1-2（Week 1：11节课 + Week 2：第2单元）\n> **素材来源**：课程PPT + 智能纪要 + 补充材料\n> **整理日期**：2026-07-10（Week 1）/ 2026-07-12（Week 2 更新）\n\n---\n\n## 课程概述\n\n### 课程目标\n- 培养数据伦理的**敏捷思维**，应对旧规则失效的技术挑战\n- 建立**批判性思维**，从多利益相关方角度分析现实伦理困境\n- 理解伦理引导不是阻碍技术进步，而是确保创新惠及所有人\n\n### 核心知识框架\n```\nDSCI6400 课程结构\n├── 第1单元：伦理理论基础（Week 1）\n│   ├── 1.1 概述（课程背景与学习方法）\n│   ├── 1.2 数据伦理的必要性\n│   ├── 1.3 跨学科方法的必要性\n│   ├── 1.4 幸福主义伦理学 (Eudaimonism)\n│   ├── 1.5 义务论伦理学 (Deontology)\n│   ├── 1.6 功利主义伦理学 (Utilitarianism)\n│   ├── 1.7 新亚里士多德主义 (Neo-Aristotelianism)\n│   ├── 1.8 平等主义伦理学 (Egalitarianism)\n│   ├── 1.9 境遇伦理学 (Situation Ethics)\n│   ├── 1.10 前AI时代计算伦理\n│   └── 1.11 AI与大数据伦理\n│\n└── 第2单元：数据收集、存储和所有权的伦理问题（Week 2）\n    ├── 2.1 行为数据 vs 自我报告数据\n    ├── 2.2 面部识别技术的伦理争议\n    ├── 2.3 隐私、保密与安全的博弈\n    ├── 2.4 数据所有权与知情同意\n    ├── 2.5 互联网数据与开源数据的伦理边界\n    ├── 2.6 被遗忘权 (Right to Be Forgotten)\n    └── 2.7 法律与监管挑战\n```\n\n---\n\n## 第1章：课程导论与背景（1.1-1.3）\n\n### 1.1 概述\n\n#### 课程背景与必要性\n- **不断演变的道德格局**：科技正以前所未有的速度发展，历史法规如今往往不足\n- **美国监管空白**：缺乏全面的联邦AI立法，算法偏见、监控、数据操纵等重大风险处于监管缺失状态\n- **欧盟AI法案**：全球领先但面临技术迭代速度超越规则更新的永恒挑战\n\n#### 课程方法论\n- **数据伦理很少是非黑即白**，必须应对灰色地带和相互竞争的利益\n- **批判性思维 + 多元视角**至关重要\n- 考虑工程师、政策制定者、用户和受影响社区的观点\n- **本课程是行动号召**：塑造更公平、以人为本的技术未来\n\n> 🔑 **核心语录**：\"数据伦理并非小众议题。它对我们未来的生活、工作和自我治理方式至关重要。\"\n\n### 1.2 数据伦理的必要性\n\n#### 四大核心挑战\n\n| 挑战 | 关键问题 | 典型案例 |\n|------|---------|---------|\n| **隐私与安全** | 侵入式监控、数据泄露 | 2017 Equifax数据泄露（1.5亿人） |\n| **算法偏见** | 强化历史社会歧视 | 亚马逊有偏见的招聘AI工具 |\n| **缺乏问责制** | \"黑箱\"模型、未经质疑的错误 | COMPAS算法的种族差异 |\n| **社会影响** | 重塑社会、非人性化 | 预测性警务针对边缘化群体 |\n\n#### 信任的核心作用\n- 公众信任是技术采用的基础\n- 信任侵蚀导致阻力（如疫苗护照应用程序）\n- 信任通过**透明度和责任感**获得\n- **伦理是建立信任的关键**\n\n#### 伦理教育的四大目的\n1. **配备工具**：检测/纠正偏差，确保公正\n2. **培养责任感**：构建可审计系统，落实个人责任制\n3. **培养推理能力**：深思熟虑地应对模糊道德困境\n4. **培养领导力**：制定符合公共利益的未来规则\n\n### 1.3 跨学科方法的必要性\n\n#### 为什么需要跨学科合作？\n- **单领域框架不足**：纯伦理哲学框架无法跟上快速发展的AI技术，纯技术逻辑忽略伦理细节\n- **多元专业知识的互补价值**：\n  - 哲学家：提供结构化推理\n  - 技术专家：阐明系统运作\n  - 法律学者：梳理合规规则\n  - 社会科学家：衡量现实世界的人口影响\n\n#### 伦理哲学的关键贡献\n- **基础分析框架**：经典伦理理论（功利主义、义务论、美德伦理学）为分析AI困境提供成熟视角\n- **批判性思维**：发现隐藏的逻辑谬误（如邮政编码作为种族偏见的代理变量）\n\n#### 核心定位\n> 伦理引导不会阻碍技术进步，而是确保创新带来**普惠的公共利益**，而非对弱势群体造成伤害。\n\n---\n\n## 第2章：经典伦理理论体系（1.4-1.9）\n\n### 2.1 幸福主义伦理学 (Eudaimonism)\n\n#### 核心理论基础\n- **理论根源**：古希腊哲学传统（苏格拉底、柏拉图、亚里士多德、伊壁鸠鲁、斯多葛派）\n- **Eudaimonia 定义**：不同于短暂快乐，指通过始终践行美德而实现的**客观、持久的人类繁荣**\n- **美德导向**：勇气、智慧、正义、节制等美德是美好生活**本身的内在组成部分**，而非手段\n\n#### 核心操作逻辑\n- **品格聚焦**：基于个体品格在整个生命周期中的全面发展来评估道德表现\n- **社会属性**：真正的幸福只有在社会环境中才能实现\n- **情境判断**：优先考虑细微判断和实践智慧，而非严格遵守规则\n\n#### 与其他伦理体系的差异\n| 特征 | 幸福主义 | 功利主义 | 义务论 |\n|------|---------|---------|--------|\n| 评判标准 | 品格发展 | 行为结果 | 规则遵循 |\n| 关注焦点 | 成为什么样的人 | 做什么 | 遵守什么 |\n| 典型问题 | \"这是否促进人的繁荣？\" | \"这是否带来最大幸福？\" | \"这是否违背普遍规则？\" |\n\n#### AI领域应用\n- 数据科学家将**透明度置于效率之上**\n- 招聘AI设计师融入**同理心**确保公平\n- 评估举报人（如Frances Haugen）时关注**道德勇气和正直**，而非结果\n\n### 2.2 义务论伦理学 (Deontology)\n\n#### 核心理论基础\n- **创始人**：康德（Immanuel Kant），启蒙运动时期\n- **核心原则**：道德价值完全取决于行为是否**出于义务**，与结果无关\n- **定言命令（Categorical Imperative）**：核心规则（不撒谎、不偷窃）是**绝对的**\n\n#### 康德的三个公式\n1. **普遍性公式**：只按你愿意成为普遍法则的准则行动\n2. **人性公式**：永远把人当作目的，而非手段\n3. **自律公式**：每个理性存在者都是道德法则的立法者\n\n#### 应用案例\n| 场景 | 义务论判断 | 理由 |\n|------|-----------|------|\n| 隐瞒病情 | ❌ 错误 | 侵犯患者知情权 |\n| 提高差生成绩 | ❌ 不道德 | 违背公平评估的核心职责 |\n| 酷刑逼供 | ❌ 绝对不可接受 | 侵犯人的固有尊严 |\n\n#### 核心批评\n- **绝对规则的刚性**：为救犹太难民而对纳粹撒谎被广泛认为道德合理，挑战了绝对禁止违反规则的立场\n\n### 2.3 功利主义伦理学 (Utilitarianism)\n\n#### 理论演变\n- **思想渊源**：古希腊伊壁鸠鲁学派\n- **边沁（Bentham）**：现代功利主义创始人，提出**享乐微积分**\n- **密尔（Mill）**：区分高级智力快乐与低级肉体快乐\n\n#### 核心框架\n- **结果主义**：仅根据行为的**实际结果**判断道德有效性\n- **两大分支**：\n\n| 分支 | 核心逻辑 | 优势 | 缺陷 |\n|------|---------|------|------|\n| **行为功利主义** | 每个行为单独评估其直接后果 | 灵活 | 可能导致不公正 |\n| **规则功利主义** | 遵循能产生最大长期利益的普遍规则 | 稳定性 | 可能过于僵化 |\n\n#### 主要批评\n- **少数群体剥削漏洞**：可能被威权政权利用为审查辩护\n- **人权冲突**：集体利益可能损害边缘化群体\n\n### 2.4 新亚里士多德主义 (Neo-Aristotelianism)\n\n#### 核心框架\n- **美德中心论**：道德评价聚焦于行为者的**品格特质**\n- **实践智慧（Phronesis）**：在具体情境中运用实践智慧做出正确判断\n- **中庸之道（Golden Mean）**：美德是两个极端之间的适中点\n  - 勇敢 = 懦弱 ← **勇敢** → 鲁莽\n  - 节制 = 麻木 ← **节制** → 放纵\n\n#### 独特优势\n- 避免功利主义**单一原则计算的过度简化**\n- 避免康德义务论**固定法则的僵化**\n- 提供全面、**以人为本**、因地制宜的框架\n\n### 2.5 平等主义伦理学 (Egalitarianism)\n\n#### 核心原则\n- **理论渊源**：卢梭（Rousseau）的社会平等与集体意志\n- **三大支柱**：平等、公平、正义\n- **核心信条**：所有个体具有**平等的道德价值**，社会差异必须得到合理证明\n\n#### 罗尔斯的正义理论\n- **无知之幕（Veil of Ignorance）**：规则制定者在不知道自身社会身份的情况下设定制度\n- **分蛋糕隐喻**：公平的决策需要摆脱个人私利偏见\n- **务实取向**：支持**适度不平等**而非绝对平均化，确保所有人获得发展所需的\"基本善\"\n\n#### 支持的政策类型\n- 累进税制\n- 全民医疗保健\n- 平权行动（Affirmative Action）\n- 普遍基本收入（UBI）\n\n### 2.6 境遇伦理学 (Situation Ethics)\n\n#### 核心原则\n- **不是道德主观主义**：保留\"充满爱心行事\"的固定目标，但**拒绝一刀切规则**\n- **Agape（圣爱）**：无条件的、以他人为中心的爱是最高道德原则\n- **情境至上**：道德判断必须考虑具体情境，没有放之四海而皆准的规则\n\n#### 应用案例\n| 场景 | 境遇伦理学判断 |\n|------|---------------|\n| 安乐死 | ✅ 支持（减轻不可忍受的痛苦符合圣爱） |\n| 为救人而说谎 | ✅ 道德义务（保护弱势群体） |\n| 公民抗命 | ✅ 道德责任（追求集体正义） |\n\n#### 核心批评\n- **可扩展性障碍**：抽象的\"爱\"原则没有明确操作指标\n- **意外后果风险**：大规模人道主义政策可能引发资源短缺等问题\n\n---\n\n## 第3章：计算伦理的历史演变（1.10-1.11）\n\n### 3.1 前AI时代计算伦理\n\n#### 各时代核心伦理问题\n\n| 时代 | 核心伦理问题 | 里程碑 |\n|------|-------------|--------|\n| **1960s-70s** 大型机 | 资源垄断、获取不平等 | 1968 ACM首份道德准则 |\n| **1970s-80s** 个人计算 | 软件盗版、计算机犯罪、数字鸿沟 | CPSR公众倡导运动 |\n| **1990s-00s** 互联网 | 数据收集、网络安全、内容监管 | 开源运动 vs 封闭生态 |\n| **2000s+** Web 2.0 | 定向广告操纵、网络骚扰、虚假信息 | 平台内容审核争议 |\n\n#### 关键洞见\n> 当前所有高优先级问题（算法偏见、监控资本主义）都是**公平和隐私长期争论的延伸**。唯一的重大变化在于现代技术风险的**规模更大、迭代更快、系统复杂性更高**。\n\n### 3.2 AI与大数据时代伦理\n\n#### 大数据时代核心风险\n- **数据所有权和同意不明确**：用户不知个人数据如何被存储、出售或重新利用\n- **算法歧视**：有偏数据集上训练的算法复制甚至放大歧视模式\n- **早期监管**：2012奥巴马报告（不具约束力）→ 2018 EU GDPR（全球基准）\n\n#### 生成式AI新兴挑战\n\n| 风险类别 | 具体表现 |\n|---------|---------|\n| **算法不透明** | 黑箱运行，不可审计 |\n| **行为操纵** | 定向广告、虚假信息模糊说服与胁迫的边界 |\n| **劳动力冲击** | 自动化取代数百万岗位 |\n| **民主危害** | 合成媒体、回音室、舆论操纵 |\n| **存在性风险** | 超级智能的长期安全控制问题 |\n\n#### 全球监管格局\n- **欧盟GDPR**：全球基准，赋予用户数据权利，违规重罚\n- **欧盟AI法案**：风险分级管理\n- **美国**：缺乏全面联邦AI立法\n- **中国**：算法推荐管理规定\n\n---\n\n## 第4章：行为数据与自我报告数据（2.1）\n\n### 4.1 两种数据类型的本质对比\n\n> 🔑 **单元导入**：\"在数字时代，复杂的算法和传感器可以持续监控和分析我们的行为、偏好和动作。虽然这些数据可以增强用户体验，但也引发了严重的隐私问题——可能导致George Orwell《1984》那样的场景。\"\n\n#### 核心对比框架\n\n| 维度 | 🗣️ 自我报告数据 (Self-Report Data) | 📊 行为数据 (Behavioral Data) |\n|------|-------------------------------------|-------------------------------|\n| **收集方式** | 调查、访谈、问卷（人工、主动） | 传感器、跟踪软件、在线活动（自动、被动） |\n| **数据性质** | 主观——基于个人感知、想法和感受 | 客观——捕捉实际行为，可量化 |\n| **典型内容** | 意见、偏好、自我评估行为 | 网站访问、购买历史、GPS位置 |\n| **核心优势** | 揭示态度、动机和经验（行为无法观察到的维度） | 更准确、不易产生偏差（记录的是真实动作） |\n| **核心缺陷** | 社会期望偏差、回忆错误、自我认知不准确 | 隐私风险、缺乏行为背后的背景/原因 |\n\n### 4.2 行为数据的十二大类型\n\n| 类型 | 示例 | 用途 |\n|------|------|------|\n| 🌐 **Web浏览数据** | 页面浏览量、点击率、停留时间、搜索查询 | 个性化内容、推荐产品、优化UX |\n| 🛒 **购买数据** | 交易历史、购买商品、购买频率、付款方式 | 分析购买模式、定制营销 |\n| 📍 **位置数据** | GPS数据、签到、IP地址跟踪 | 基于位置的服务、优化供应链 |\n| 💬 **社交媒体活动** | 点赞、分享、评论、发布、关注 | 衡量品牌情绪、监控趋势 |\n| 📱 **移动App使用** | 安装量、使用频率、应用内购买 | 改进App设计、增强用户参与 |\n| 📞 **客户服务互动** | 通话记录、聊天记录、支持工单 | 评估服务质量、识别常见问题 |\n| 📧 **电子邮件参与度** | 打开率、点击率、响应率 | 完善邮件营销、衡量活动效果 |\n| ⌚ **可穿戴设备数据** | 活动水平、心率、睡眠模式 | 个性化健康计划 |\n| 🏠 **物联网设备数据** | 智能家居交互、能源消耗 | 节能优化、智能家居生态 |\n| 🎬 **流媒体消费** | 观看历史、观看时间、播放列表 | 内容推荐、观众偏好分析 |\n| 🔐 **生物特征数据** | 面部识别、语音识别 | 身份验证、安全、个性化 |\n| 📊 **网站统计** | 每日/小时统计、热门页面、引荐来源 | 流量分析、SEO优化 |\n\n### 4.3 行为数据的伦理悖论\n\n- **精确性 vs 隐私**：行为数据更准确，但收集过程本身可能构成隐私侵犯\n- **全面性 vs 去语境化**：能记录\"做了什么\"，但无法解释\"为什么这样做\"\n- **自动化 vs 知情权**：数据在用户不知情时被自动采集\n\n> 💡 **思考**：Google Timeline 能精确记录你访问的时间、交通方式、在每个地方停留的时间——\"谷歌比我更了解我自己\"。这种便利的边界在哪里？\n\n---\n\n## 第5章：面部识别技术的伦理争议（2.2）\n\n### 5.1 Clearview AI 案例——\"你的脸属于我们\"\n\n#### 核心问题\n- Kashmir Hill（《纽约时报》记者）揭露 Clearview AI 的软件已进入**执法部门、私营公司和个人投资者**手中\n- 不受约束的面部识别技术 (FRT) 可能导致：\n  - 🚨 隐私侵犯\n  - 🚨 监视能力增强\n  - 🚨 因身份错误导致的**错误逮捕**\n\n#### 全球对比警示\n- Hill 将美国现状与中国、俄罗斯等国的广泛应用进行比较\n- 提出**反乌托邦**式监视和控制的警示故事\n- 《1984》隐喻：\"老大哥在看着你！\"\n\n### 5.2 中国的社会信用体系\n\n| 维度 | 具体表现 |\n|------|---------|\n| **摄像头网络** | Skynet——全球最大视频监控网络，超6亿个摄像头，平均每两个成年人一个摄像头 |\n| **实时扫描** | 面部识别系统可在1秒内扫描全部14亿人口面部 |\n| **行为评分** | 积极行为（志愿服务）提分，消极行为（乱扔垃圾）降分 |\n| **实际影响** | 截至2019年，低分者被拒绝乘坐飞机超1700万次、火车超500万次 |\n| **生活限制** | 低分限制旅行、就业、金融服务和合同签订 |\n\n### 5.3 隐私 vs 安全——\"任何事物都有两面\"\n\n#### 面部识别的正面应用\n\n| 应用场景 | 典型案例 |\n|---------|---------|\n| 🔍 **执法破案** | 2017年，FBI利用FRT识别并逮捕一名通缉16年的罪犯 |\n| 🛡️ **反恐** | 2018年俄罗斯世界杯期间，成功识别监视名单上的个人 |\n| ✈️ **边境安全** | 美国CBP使用FRT有效识别使用假护照的冒名顶替者 |\n\n#### 面部识别的负面风险\n\n| 风险 | 案例 |\n|------|------|\n| 🏴 **政治监控** | 香港抗议中，示威者破坏\"智能灯柱\"，怀疑装有FRT |\n| 🗣️ **言论压制** | 阿根廷人权组织担忧监控导致自我审查 |\n| ⚖️ **身份错误** | 错误匹配导致无辜者被错误逮捕 |\n\n### 5.4 利益冲突 (Conflict of Interest) 的视角转换\n\n> 🔑 **核心洞见**：同一个人，在不同角色下可能对面部识别技术持完全相反的立场。\n\n| 角色情境 | 对FRT的态度 |\n|---------|------------|\n| 🏛️ 政治活动家 | ❌ 反对——威胁隐私和言论自由，扼杀政治异议 |\n| ✈️ 旅行者 | ✅ 支持——赞赏边境安全措施的效率 |\n| 🚨 犯罪受害者 | ✅ 支持——快速识别犯罪者，追回损失 |\n\n> 💡 **结论**：在保护隐私和确保安全之间取得平衡，是政策制定者和整个社会面临的**核心挑战**。**透明度和问责制**是两个极端之间的调解者。\n\n---\n\n## 第6章：隐私、保密与安全的博弈（2.3）\n\n### 6.1 核心概念辨析\n\n| 概念 | 定义 | 关注焦点 | 典型示例 |\n|------|------|---------|---------|\n| 🔒 **隐私 (Privacy)** | 个人控制对其个人信息访问的权利 | 个人对自身信息的**权利和自主权** | 决定谁可查看健康记录 |\n| 🤫 **保密 (Confidentiality)** | 受委托方保护信息免于未授权访问的**义务** | 信任关系内共享信息的**保护责任** | 医生对患者病历保密 |\n| 🛡️ **安全 (Security)** | 防御网络威胁、保护数据免于泄露的**技术措施** | 系统层面的**防御与应对** | 网络安全工具、事件响应 |\n\n### 6.2 隐私与安全的根本矛盾\n\n> \"我们既希望免受监控，又希望获得监控带来的保护——但这两个目标可能相互矛盾。\"\n\n| 我们想要的... | 矛盾之处 |\n|--------------|---------|\n| 隐私不被侵犯 | 但被黑客攻击时希望有广泛日志来追踪罪犯 |\n| 不被网络追踪 | 但设备丢失时希望科技公司能定位追踪 |\n| 数据不被监控 | 但遭受数据泄露后要求更强的监控能力 |\n\n### 6.3 隐私法律现状（截至2024年）\n\n#### 美国：无全面联邦法律\n- **FERPA**（家庭教育权利和隐私法案）：保护学生教育记录\n- **FTC法案**：防止不公平或欺骗性行为\n- **面部识别**：截至2024年7月，无全面联邦FRT法律，仅有州和地方法律\n\n#### 欧洲：GDPR全球基准\n- 赋予个人对其数据的广泛权利\n- 违规罚款严厉\n\n### 6.4 保护隐私的工具\n\n| 工具类型 | 代表产品 | 能做什么 | 不能做什么 |\n|---------|---------|---------|-----------|\n| 🕵️ **无痕浏览** | Chrome Incognito | 不保存浏览历史/Cookie/表单信息 | 对ISP隐藏活动、隐藏IP地址、防御恶意软件 |\n| 🦊 **隐私浏览器** | Safari / Firefox | 更强的隐私保护选项 | 完全匿名 |\n| 🔐 **VPN** | 各类VPN服务 | IP掩蔽、流量加密、地理重定位、ISP盲目 | 100%不可追踪 |\n| 🔑 **其他工具** | — | 加密软件、2FA、安全云存储、防火墙 | 消除所有风险 |\n\n> ⚠️ **关键认知**：无痕模式 ≠ 完全匿名。它仅对**本地设备**隐藏痕迹，对ISP、访问的网站、恶意软件均无防护。\n\n---\n\n## 第7章：安全风险与数据泄露（2.4）\n\n### 7.1 安全风险的本质\n\n> 🔑 **核心原则**：\"能力越大，责任越大。\"——AI和大数据赋予企业与政府前所未有的能力，相应的保护义务也随之增大。\n\n- 安全风险在AI时代之前就已存在\n- 大数据使大规模维护安全变得**更具挑战性**\n- 大数据生态系统的**复杂性**引入难以管理的漏洞\n\n### 7.2 重大数据泄露案例\n\n| 事件 | 时间 | 影响规模 | 泄露内容 |\n|------|------|---------|---------|\n| **Equifax** | 2017 | 1.47亿美国人 | SSN、出生日期、地址 |\n| **Yahoo** | 2013-2016 | 全球30亿+账户 | 姓名、邮箱、电话、加密密码 |\n| **Microsoft Exchange** | 2021 | 3万美国组织 + 6万全球组织 | 电子邮件账户访问权限 |\n| **SolarWinds供应链攻击** | 2020 | 多个美国政府机构 + 大量企业 | 财政部、商务部、能源部机密信息 |\n\n### 7.3 生物特征数据的独特风险\n\n- **无法有效加密**：面部数据在保持实用性的同时无法像密码一样加密\n- **分布式存储**：面部信息散布在驾照数据库、执法记录、社交媒体等多个平台\n- **拼图效应**：恶意行为者可将各种数据点拼凑，轻易勾勒一个人的完整生活画像\n\n### 7.4 外国政府参与的安全风险——TikTok案例\n\n| 维度 | 内容 |\n|------|------|\n| **核心担忧** | 字节跳动可能因中国《国家安全法》被要求向政府提供TikTok用户数据 |\n| **中国法律要求** | 个人和组织均须协助情报机构侦查间谍活动 |\n| **美方应对** | 2024年3月众议院通过立法：要求字节跳动出售TikTok，否则在美被禁 |\n| **TikTok回应** | 否认中国政府控制，提出\"德克萨斯计划\"（Project Texas）等内部监督措施 |\n| **批评声音** | 内部监督机制不足以消除国家级安全风险 |\n\n> 💡 **对称性观察**：中国同样出于国家安全考虑封禁了Google、YouTube、Facebook，认为这些平台是外部势力影响公众情绪的渠道。\n\n---\n\n## 第8章：数据所有权与知情同意（2.5-2.6）\n\n### 8.1 知情同意的困境 (Informed Consent)\n\n#### 现实问题\n- 隐私政策**冗长复杂**，几乎无人通读\n- 即使尝试阅读，无法律背景的人**无法真正理解**数据被收集和使用的范围\n- 导致**\"不知情\"或\"半被迫\"的同意**\n- 用户\"不情愿地\"放弃权利，任由公司随意处置数据\n\n#### 典型案例：未获知情同意\n\n| 案例 | 时间 | 核心问题 |\n|------|------|---------|\n| **X/Grok** | 2024 | 在未通知用户或未征求同意的情况下，为用户帖子收集数据训练AI聊天机器人 |\n| **剑桥分析** | 2016 | 通过个性测试App获取5000万（后修正为8700万）Facebook用户数据，含好友数据 |\n\n### 8.2 剑桥分析丑闻深度剖析\n\n```\n事件链条：\n用户安装\"这就是你的数字生活\"App\n       ↓\nApp收集安装者数据 + 其Facebook好友数据（未经好友同意）\n       ↓\n8700万用户数据流入剑桥分析\n       ↓\n心理特征分析：每用户5000个数据点\n       ↓\n根据性格特征定制政治信息 → 定向政治广告\n       ↓\n可能影响2016美国总统大选 + 英国脱欧公投\n       ↓\n2018年丑闻爆发 → 剑桥分析破产\n       ↓\n2019年FTC对Facebook罚款50亿美元\n```\n\n### 8.3 数据所有权的模糊性\n\n| 问题 | 说明 |\n|------|------|\n| 🤝 **数据共创** | 社交媒体数据由用户创建，但由平台存储和处理——谁拥有？ |\n| 🔄 **衍生品与聚合** | AI从现有数据生成新数据/见解时——衍生数据产品归谁？ |\n| 💰 **利润不共享** | 公司将用户数据出售给第三方投放广告，却不与用户分享利润 |\n\n### 8.4 互联网数据与开源数据的伦理边界\n\n#### 核心争议：使用互联网数据的权利边界在哪里？\n\n| 争议焦点 | 关键问题 |\n|---------|---------|\n| 🕷️ **网络抓取** | OpenAI等公司用爬虫从互联网收集数据训练LLM——是\"窃取\"还是合理使用？ |\n| 🔥 **蒸馏技术** | DeepSeek等小公司从ChatGPT蒸馏知识降低成本——是\"从小偷那里偷\"还是技术创新？ |\n| 📜 **知识产权** | 使用公开可得的数据，是侵犯所有权还是合理使用（Fair Use）？ |\n| 🤝 **开源社区** | 利用开源贡献却不回馈，是否破坏开放协作精神？ |\n| 🔍 **透明度** | AI公司是否应披露数据源并认可原始内容创造者？ |\n\n> 💡 **蒸馏的法律与道德边界**：蒸馏让公司无需投入同等资源就能从大型AI模型获益，但许多基于蒸馏的模型并未认可或补偿原始创造者——技术上合法，道德上存疑。\n\n---\n\n## 第9章：被遗忘权与法律监管（2.7）\n\n### 9.1 被遗忘权 (Right to Be Forgotten, RTBF)\n\n#### 核心概念\n- **定义**：个人有权要求删除不再相关或对其生活产生负面影响的过去记录\n- **起源**：2014年欧洲法院 (ECJ) 确立\n- **GDPR条款**：当数据对收集目的不再重要、个人撤回同意、或数据被非法处理时，可要求删除\n- **核心矛盾**：个人隐私权 vs 历史事实保存 + 公众知情权\n\n#### 全球法律对比\n\n| 地区 | 被遗忘权状况 |\n|------|------------|\n| 🇪🇺 **欧洲** | 最发达——GDPR赋予明确权利，ECJ 2014年确立 |\n| 🇺🇸 **美国** | 无全面RTBF法律；加州CCPA赋予部分删除权 |\n| 🇯🇵 **日本** | 2017年最高法院判决：权衡公众知情权 vs 隐私权，倾向于前者 |\n\n### 9.2 被遗忘权经典案例\n\n| 案例 | 时间 | 判决结果 | 核心逻辑 |\n|------|------|---------|---------|\n| **Costeja González 诉 Google** | 2014 | ✅ 原告胜诉 | 搜索引擎须删除\"不充分、不相关或不再相关\"的信息 |\n| **荷兰外科师案** | 2019 | ❌ 原告败诉（上级法院推翻） | 试图删除停职记录——公共利益 > 个人隐私 |\n| **日本男子案** | 2017 | ❌ 原告败诉 | 儿童色情罪逮捕记录——犯罪严重性 + 搜索结果属受保护言论 |\n| **NT1 诉 Google** | 2018 | ❌ 请求驳回 | 伪造账目罪——与公众利益仍有关联 |\n| **NT2 诉 Google** | 2018 | ✅ 请求支持 | 窃听罪（刑期短）——已不相关，隐私权优先 |\n\n### 9.3 Mimi Groves 案——\"永远为15岁的行为负责？\"\n\n```\n事件线：\n2016年：15岁的Mimi在Snapchat发布种族歧视语言短视频\n         ↓\n2020年：老同学Jimmy保存视频并公开发布（BLM运动期间）\n         ↓\n视频疯传 → 田纳西大学施压 → Mimi撤回录取\n         ↓\n伦理争议：\n  • Mimi是否应永远为15岁时的行为负责？\n  • 她有被遗忘和被原谅的权利吗？\n  • Jimmy的行为是揭露种族主义还是报复性破坏？\n  • 公开羞辱的程度和方式是否过于严厉？\n```\n\n### 9.4 被遗忘权的现实局限\n\n> ⚠️ **残酷现实**：几乎没有什么内容会被真正删除和遗忘。\n\n- 网站存档工具（如 Wayback Machine 自1996年起收集快照）\n- 时间旅行工具（timetravel.mementoweb.org）\n- 信息一旦上网，可能永久存在\n\n### 9.5 法律与监管挑战\n\n| 挑战维度 | 具体表现 |\n|---------|---------|\n| 🌍 **管辖权冲突** | 数据存储在一个国家，由另一国实体拥有 → 法律框架冲突 |\n| 📜 **法规滞后** | GDPR确立数据保护权，但衍生数据所有权仍模糊 |\n| 🔗 **数据不透明** | 公司不透明地说明如何收集、使用、共享数据 |\n| 💰 **利益分配** | 出售用户数据获利，用户无份额 |\n| 🎭 **政治操纵** | 数据被用于政治操纵（剑桥分析案） |\n\n### 9.6 找到平衡点\n\n> \"尽管技术进步有缺点，我们并不主张逆转工业化、禁止车辆或拆除互联网。社会的目标是在进步与降低风险之间取得平衡。同样的道理也适用于大数据和人工智能。\"\n\n| 类比 | 负面后果 | 社会应对 |\n|------|---------|---------|\n| 工业化 | 环境污染 | 环保法规 + 可持续发展 |\n| 车辆 | 交通事故 | 交通规则 + 安全技术 |\n| 互联网 | 网络犯罪 | 网络安全 + 数据保护 |\n| **AI/大数据** | **隐私侵犯、算法偏见** | **伦理框架 + 监管法规** |\n\n> 🔑 **目标**：最大限度地发挥技术进步带来的**好处**，同时实施保障措施和法规以**最小化**其负面影响。\n\n---\n\n## 全课程知识图谱\n\n```\nAI伦理学知识体系\n│\n├── 元理论层（第1章）\n│   ├── 伦理学的必要性（为什么需要伦理？）\n│   ├── 跨学科方法（谁能提供视角？）\n│   └── 道德推理方法（如何思考伦理问题？）\n│\n├── 规范伦理学（第2章）\n│   ├── 幸福主义 → 品格与繁荣\n│   ├── 义务论 → 规则与义务\n│   ├── 功利主义 → 结果与效用\n│   ├── 新亚里士多德 → 美德与实践智慧\n│   ├── 平等主义 → 公平与正义\n│   └── 境遇伦理学 → 爱与具体情境\n│\n├── 历史演变层（第3章）\n│   ├── 前AI时代（大型机→PC→互联网→Web2.0）\n│   └── AI时代（大数据→生成式AI→AGI风险）\n│\n├── 数据收集与行为伦理（第4章）\n│   ├── 行为数据 vs 自我报告数据\n│   ├── 行为数据12大类型\n│   └── 行为数据的伦理悖论\n│\n├── 监控与面部识别（第5章）\n│   ├── Clearview AI案例\n│   ├── 社会信用体系 vs 执法/反恐应用\n│   └── 利益冲突的多视角分析\n│\n├── 隐私-保密-安全三角（第6章）\n│   ├── 三概念辨析\n│   ├── 隐私与安全的根本矛盾\n│   └── 隐私保护工具\n│\n├── 安全风险与数据泄露（第7章）\n│   ├── 四大泄露事件\n│   ├── 生物特征加密困境\n│   └── TikTok与外国政府风险\n│\n├── 数据所有权与同意（第8章）\n│   ├── 知情同意困境\n│   ├── 剑桥分析事件链\n│   ├── 数据共创与衍生品归属\n│   └── 互联网/开源数据伦理边界\n│\n├── 被遗忘权与法律监管（第9章）\n│   ├── RTBF概念与全球对比\n│   ├── 五大经典案例\n│   ├── 互联网存档的现实局限\n│   └── 法律管辖权与监管挑战\n│\n└── 治理与监管（贯穿全课程）\n    ├── GDPR / AI法案 / CCPA\n    ├── 企业自律\n    ├── 行业准则（ACM等）\n    └── 透明度与问责制\n```\n\n## 六大伦理理论对比总结\n\n| 理论 | 核心问题 | 评判标准 | 优势 | 弱点 |\n|------|---------|---------|------|------|\n| 幸福主义 | 什么促进人的繁荣？ | 品格发展 | 全面、人性化 | 难以操作化 |\n| 义务论 | 是否出于义务？ | 规则遵循 | 稳定、明确 | 过于刚性 |\n| 功利主义 | 是否带来最大幸福？ | 结果效用 | 直观、实用 | 忽视少数 |\n| 新亚里士多德 | 是否体现美德？ | 品格+实践智慧 | 灵活、务实 | 主观性强 |\n| 平等主义 | 是否公平？ | 分配正义 | 关注弱势群体 | 可能抑制效率 |\n| 境遇伦理学 | 什么最有爱心？ | 情境中的爱 | 高度灵活 | 缺乏标准 |\n\n## 第2单元核心概念速查表\n\n| 概念 | 英文 | 一句话定义 |\n|------|------|-----------|\n| 行为数据 | Behavioral Data | 通过技术自动收集的客观行为记录 |\n| 自我报告数据 | Self-Report Data | 通过调查/访谈获取的主观态度数据 |\n| 面部识别技术 | FRT (Facial Recognition Technology) | 利用面部特征进行身份识别的技术 |\n| 隐私 | Privacy | 个人控制自身信息访问的权利 |\n| 保密 | Confidentiality | 受委托方保护信息的义务 |\n| 安全 | Security | 防御网络威胁的技术措施 |\n| 知情同意 | Informed Consent | 用户在充分了解情况后自愿同意 |\n| 数据所有权 | Data Ownership | 数据归谁所有、谁有权处置 |\n| 蒸馏技术 | Distillation | 从大模型提取知识训练小模型 |\n| 被遗忘权 | RTBF (Right to Be Forgotten) | 要求删除不相关个人数据的权利 |\n| 利益冲突 | Conflict of Interest | 同一人在不同角色下对技术持矛盾立场 |\n\n---\n\n## 复习要点清单\n\n### 第1单元复习（Week 1）\n- [ ] 能说出数据伦理的四大核心挑战\n- [ ] 理解五大规范伦理学的核心区别\n- [ ] 能用不同伦理理论分析同一个AI案例\n- [ ] 掌握计算伦理的历史演变脉络\n- [ ] 了解GDPR和AI法案的核心内容\n- [ ] 理解跨学科合作在AI伦理中的必要性\n\n### 第2单元复习（Week 2）\n- [ ] 能对比行为数据与自我报告数据的优劣\n- [ ] 列举行为数据的主要类型及各自伦理风险\n- [ ] 分析面部识别技术\"隐私 vs 安全\"的两难困境\n- [ ] 理解\"利益冲突\"——同一人在不同角色下对FRT的矛盾立场\n- [ ] 辨析隐私、保密、安全三个概念的区别与联系\n- [ ] 说出四大重大数据泄露事件及其影响\n- [ ] 理解生物特征数据无法有效加密的独特风险\n- [ ] 分析TikTok案例中的外国政府安全风险\n- [ ] 解释知情同意的困境——为什么\"同意\"往往是\"不知情\"的\n- [ ] 复述剑桥分析事件的完整链条与影响\n- [ ] 理解互联网数据/开源数据使用的伦理边界（网络抓取、蒸馏、知识产权）\n- [ ] 掌握被遗忘权的定义、起源与全球法律对比\n- [ ] 分析Mimi Groves案、Costeja案等经典被遗忘权案例\n- [ ] 理解\"几乎没有什么内容会被真正删除\"的现实含义\n- [ ] 能在\"技术进步 vs 风险管控\"框架下提出平衡方案\n\n---\n\n> 📝 **学习方法建议**：\n> - **Week 1**：选取一个AI伦理案例（如自动驾驶决策），分别用6种理论分析，比较不同结论\n> - **Week 2**：选取一个数据收集场景（如社交媒体行为追踪），从隐私、安全、所有权、知情同意四个维度分析其伦理风险\n\n---\n", "is_refined": true, "has_original": false}, {"id": "dsci6700_full", "title": "文本挖掘 · 完整笔记", "markdown": "\n# DSCI6700 文本挖掘与非结构化数据 · 系统化学习笔记\n\n> **课程信息**：HPU 夏威夷太平洋大学 · AI硕士项目\n> **学习周期**：Week 1-2\n> **素材来源**：课程PPT + 智能纪要（8节+补充文档）\n> \n> **整理日期**：2026-07-10（Week 2更新于2026-07-13）\n\n---\n\n## 课程概述\n\n### 课程目标\n- 理解**结构化数据 vs 非结构化数据**的本质区别与各自的局限\n- 掌握**NLP**的三大支柱：句法(Syntax)、语义(Semantics)、语用学(Pragmatics)\n- 理解**大语言模型(LLM)**的Transformer架构与预训练+微调范式\n- 掌握**文本挖掘**的概念、流程与跨行业应用\n- 了解文本挖掘的**历史发展脉络**与未来方向\n\n### 核心知识框架\n```\nDSCI6700 知识体系\n├── Week 1: 基础概念\n│   ├── 1.1 引言（为什么需要文本挖掘？）\n│   ├── 1.2 非结构化数据类型\n│   ├── 1.3 自然语言处理 (NLP)\n│   ├── 1.4 大语言模型 (LLM)\n│   ├── 1.5 文本挖掘\n│   ├── 1.6 文本挖掘的历史与发展\n│   ├── 1.7 文本分析的另一段历史（人文科学根源）\n│   └── 1.8 总结\n├── Week 2: 文本预处理与文本表示\n│   ├── 2.1 文本预处理概述\n│   ├── 2.2 分词（Tokenization）\n│   ├── 2.3 词干提取（Stemming）\n│   ├── 2.4 词形还原（Lemmatization）\n│   ├── 2.5 停用词移除（Stop-word Removal）\n│   ├── 2.6 特殊字符处理\n│   ├── 2.7 TF-IDF（词频-逆文档频率）\n│   ├── 2.8 N元语法（N-gram）\n│   └── 2.9 词嵌入（Word Embedding）\n└── 后续Week...\n```\n\n---\n\n## 第1章：引言与非结构化数据（1.1-1.2）\n\n### 1.1 为什么需要文本挖掘？\n\n#### 结构化数据的局限性\n\n| 局限 | 说明 | 例证 |\n|------|------|------|\n| **预设框架约束** | 将复杂现实映射到预设理论框架，遗漏创造力、情商等核心维度 | IQ测试简化人的智力 |\n| **虚假客观性** | 数字指标创造误导性客观感，简化的排名指标带有隐藏偏见 | Gould《人类的错误测量》 |\n| **认知盲点** | 纯定量分析遗漏不可量化的关键信息 | Cameron：\"并非所有重要的东西都能被量化\" |\n\n#### 文本挖掘的核心优势\n1. **互补性根本原因识别**：数值数据只反映\"是什么\"，文本挖掘揭示\"为什么\"\n2. **实时响应支持**：对社交媒体、新闻源的实时文本挖掘可即时洞察公众情绪\n3. **偏差减少效应**：全面分析完整非结构化数据集，发现传统框架忽略的联系\n4. **混合方法赋能**：结合定性研究深度与大规模定量分析严谨性\n\n> 🔑 **核心语录**：\"只听取明确表述的内容只能了解故事的一部分。\" —— Ziad Jamal\n\n### 1.2 非结构化数据的类型\n\n#### 数据类型全景\n\n| 类型 | 基本范围 | 核心分析障碍 |\n|------|---------|-------------|\n| **文本数据** | 邮件、社交媒体、PDF、开放式调查 | 机器频繁误解隐含语气、主题和语境 |\n| **多媒体数据** | 图像(JPEG)、视频(MP4)、音频(MP3) | 计算机视觉/语音识别成本高、准确率不稳定 |\n| **IoT/传感器数据** | 智能恒温器、健身追踪器、服务器日志 | 流噪声过滤和实时异常检测 |\n| **Web/交互式数据** | 网页内容、元数据、社交媒体互动 | 处理冲突标准和混合俚语 |\n\n#### 多媒体数据的处理工作流\n```\n多媒体数据 → 转录工具(Zoom/Rev/Descript) → 文本 → NLP分析\n```\n> 大多数团队先将多媒体**转录为文本**，再运行NLP分析。\n\n---\n\n## 第2章：NLP与大语言模型（1.3-1.4）\n\n### 2.1 自然语言处理 (NLP)\n\n#### 核心定义\nNLP是人工智能的专门子领域，专注于教会计算机**理解、解释和生成**人类语言。\n\n#### 三大核心目标\n1. 解码隐含的语言结构和意义\n2. 弥合人机通信差距\n3. 从海量非结构化文本数据集中提取见解\n\n#### NLP三大语言学支柱\n\n| 支柱 | 研究内容 | 示例 |\n|------|---------|------|\n| **句法 (Syntax)** | 语言的语法结构和规则 | 词性标注、句法分析 |\n| **语义 (Semantics)** | 语言的含义 | 词义消歧、情感分析 |\n| **语用学 (Pragmatics)** | 语境中的语言使用 | 讽刺识别、意图理解 |\n\n#### NLP技术演进四阶段\n\n```\n阶段1: 基于规则    → 手工编写语法规则\n阶段2: 统计概率    → n-gram、隐马尔可夫模型\n阶段3: 传统ML     → SVM、随机森林、CRF\n阶段4: 深度学习    → Transformer、RNN、BERT、GPT（当前主流）\n```\n\n#### 典型应用场景\n- 文本挖掘（类别/情感提取）\n- 机器翻译（Google Translate）\n- 自动摘要\n- 语音识别（Siri、Alexa）\n- 搜索引擎信息检索\n\n### 2.2 大语言模型 (LLM)\n\n#### 核心定义\nLLM是基于深度学习和大量预训练数据集构建的先进AI系统，用于高效处理和生成人类自然语言。\n\n#### Transformer架构（核心技术）\n- **起源**：2017年论文《Attention Is All You Need》\n- **自注意力机制**：评估文本中每个单词的相对重要性，**不受位置限制**\n- 所有主流LLM（GPT、BERT等）都基于此架构\n\n#### 双阶段训练流程\n\n| 阶段 | 方法 | 目标 |\n|------|------|------|\n| **预训练 (Pre-training)** | 无监督学习，预测缺失/后续词 | 学习通用语言规则 |\n| **微调 (Fine-tuning)** | 有监督学习，特定任务标注数据 | 适应翻译、法律分析等具体场景 |\n\n#### LLM vs 传统搜索引擎\n\n| 维度 | 早期LLM | 传统搜索引擎 |\n|------|---------|-------------|\n| 数据来源 | 预训练固定数据集 | 实时互联网 |\n| 交互方式 | 类人对话 | 关键词匹配 |\n| 输出生成 | 生成式 | 检索式 |\n\n---\n\n## 第3章：文本挖掘核心（1.5）\n\n### 3.1 文本挖掘的定义与机制\n\n#### 核心定义\n将杂乱无章、非结构化的原始文本转换为**标准化的结构化格式**，将定性语言转化为**可量化的见解**。\n\n#### 与数据挖掘的区别\n\n| 维度 | 数据挖掘 | 文本挖掘 |\n|------|---------|---------|\n| 数据对象 | 结构化数值数据 | 自由格式文本 |\n| 核心任务 | 发现数值模式 | 从文本中提取模式和见解 |\n| 预处理 | 较少 | 需要大量文本预处理 |\n| 输出 | 数值模型/规则 | 主题、情感、关键词等 |\n\n### 3.2 跨行业应用\n\n#### 公共/专业领域\n| 行业 | 应用 |\n|------|------|\n| **公共安全** | 自动标记社交媒体威胁内容，筛查海量通信 |\n| **医疗保健** | 临床研究辅助、诊断支持 |\n| **金融** | 欺诈检测 |\n| **法律** | 快速合同审查 |\n\n#### 后端/日常工具\n- 内容推荐系统（Netflix、YouTube）\n- 垃圾邮件过滤器\n- 实时社交媒体监测\n- 学术文献检索\n- 网络安全（漏洞识别）\n\n---\n\n## 第4章：文本挖掘的历史发展（1.6-1.7）\n\n### 4.1 技术发展时间线\n\n```\n1950s-60s ─── 自动文档索引和检索\n              │ Gerard Salton (1961) SMART系统 → 奠定核心框架\n              │\n1960s-70s ─── 形式语法和解析系统\n              │ 早期机器翻译研究 → NLP基础\n              │\n1970s-80s ─── 命名实体识别 (NER)\n              │ 1987 消息理解会议 (MUC) → 标准化技术基准\n              │\n1980s-90s ─── 统计方法兴起\n              │ 摒弃手工规则 → n-gram概率模型\n              │\n1990s-00s ─── 潜在语义分析 (LSA)\n              │ 在线文本爆炸 → Web挖掘、大规模文档分析\n              │\n2000s-10s ─── SVM分类 + LDA主题建模\n              │ Blei et al. (2003) LDA革命 → 情感挖掘蓬勃发展\n              │\n2010s+ ────── Word2Vec → RNN/LSTM → Transformer/BERT → GPT\n              │ 少样本/零样本学习 → 类人文本处理\n              │\n现在+未来 ─── 可解释性 + 算法偏差减少 + 低能耗 + 跨语言\n```\n\n### 4.2 人文科学根源（另一段历史）\n\n#### Don R. Swanson的开创性贡献\n- **\"未被发现的公共知识\"概念（1986）**：通过连接看似不相关的学术概念产生研究假设\n- **核心方法**：跨孤立概念连接（而非专业领域专长）\n- **经典验证**：鱼油对雷诺病的作用、压力-偏头痛-镁的联系\n\n#### 核心洞见\n> \"零散、独立创作的学术作品比作未组装的拼图碎片，隐藏的见解正等待着那些愿意将离散的知识点联系起来的人。\"\n\n#### 对现代实践的启示\n- 现代ML/LLM文本分析建立在**早期定性文本分析框架**的知识基础之上\n- **有价值的知识洞察不一定需要先进算法**，也可以源自好奇心、仔细研读和创造性跨概念关联\n\n---\n\n\n---\n\n## 第5章：文本预处理（Text Preprocessing）\n\n> **来源**：Week 2 章节补充学习内容\n> **核心主题**：将原始文本转换为算法可处理的结构化格式\n\n### 5.1 文本预处理概述\n\n#### 定义\n文本预处理（Text Preprocessing）是为机器学习模型或自然语言处理（NLP）任务准备原始文本时的关键步骤。其目标是将文本转换为算法易于理解的**结构化格式**。\n\n#### 预处理流程全景\n```\n原始文本 → 分词(Tokenization) → 小写转换 → 停用词移除 → 词干提取/词形还原 → 特殊字符处理 → 数值化处理(TF-IDF/词嵌入)\n```\n\n#### 核心步骤组成\n| 步骤 | 英文术语 | 目的 |\n|------|---------|------|\n| 分词 | Tokenization | 将连续文本拆分为独立的标记（token） |\n| 词干提取 | Stemming | 通过去除后缀将单词还原为词干形式 |\n| 词形还原 | Lemmatization | 运用语言学知识将单词转换为词典基础形式 |\n| 停用词移除 | Stop-word Removal | 删除对分析无贡献的高频功能词 |\n| 特殊字符处理 | Special Character Handling | 移除或保留标点、符号等非文字字符 |\n| 小写转换 | Lower Casing | 统一大小写，避免同一词被识别为不同标记 |\n\n### 5.2 分词（Tokenization）\n\n#### 核心定义\n分词是将文本分割成更小单位（词、短语、符号等）的过程，这些单位称为**标记（Token）**。\n\n#### 分词的注意事项\n- 标点符号需要与单词分开处理，但结果必须**保持意义**\n- 例：IP地址\"129.2.13.105\"中的句点不能简单删除，否则变成无意义的\"129213105\"\n- 分词粒度可以是词级别、子词级别或字符级别\n\n### 5.3 词干提取（Stemming）\n\n#### 定义\n词干提取通过去除诸如\"ing\"\"ed\"\"ly\"之类的后缀，将单词还原为其**词干形式**。它借助启发式方法实现，所得结果**不一定都是有效的单词**。\n\n#### 示例\n```\n原始词：[\"fishing\", \"fished\", \"fisher\"]\n提取词干后：[\"fish\", \"fish\", \"fisher\"]\n```\n> \"fishing\"和\"fished\"都被简化为\"fish\"，而\"fisher\"保持不变。\n\n#### 三大词干提取器对比\n\n| 维度 | Porter 词干提取器 | Snowball 词干提取器 | Lancaster 词干提取器 |\n|------|-------------------|--------------------|--------------------|\n| **别名** | Porter Stemmer | Porter2 Stemmer | Lancaster Stemmer |\n| **开发者** | Martin Porter (1980) | 基于Snowball语言开发 | Lancaster大学 |\n| **核心原理** | 去除英语常见形态和屈折词尾 | 基于Porter改进，更先进 | 使用外部规则进行迭代运算 |\n| **激进程度** | 适中 | 比Porter更激进 | 最激进 |\n| **多语言支持** | ❌ 仅英语 | ✅ 支持多语言 | ❌ 主要英语 |\n| **速度** | 快 | 比Porter更快 | 较快，但处理短单词可能混淆 |\n| **准确率** | 速度与准确率的较好平衡 | 综合表现最佳 | 可能过度提取（over-stemming） |\n| **适用场景** | 文本挖掘、信息检索 | 多语言文本处理 | 对速度要求极高的场景 |\n\n> 🔑 **选择建议**：对于英语文本，**Porter**通常在速度和准确率之间实现了较好的平衡；**Snowball**（Porter2）是更先进、更广泛使用的选择；**Lancaster**最激进，需注意短单词处理问题。\n\n#### Python代码示例（NLTK词干提取）\n```python\nfrom nltk.stem import PorterStemmer, SnowballStemmer, LancasterStemmer\n\n# 初始化三种词干提取器\nporter = PorterStemmer()\nsnowball = SnowballStemmer(\"english\")\nlancaster = LancasterStemmer()\n\nwords = [\"running\", \"ran\", \"runner\", \"fishing\", \"fished\", \"better\"]\n\n# 对比三种提取器\nfor word in words:\n    print(f\"{word:12s} → Porter: {porter.stem(word):10s} | \"\n          f\"Snowball: {snowball.stem(word):10s} | \"\n          f\"Lancaster: {lancaster.stem(word)}\")\n```\n\n### 5.4 词形还原（Lemmatization）\n\n#### 定义\n词形还原与词干提取类似，但它运用**语言学知识**将单词转换为其**基础形式或词典形式（词元，Lemma）**。与词干提取不同的是，词形还原的结果是**真实存在的单词**。\n\n#### 示例\n```\n词形还原：[\"running\", \"ran\", \"runner\"] → [\"run\", \"run\", \"runner\"]\n```\n\n#### 词干提取 vs 词形还原对比\n\n| 维度 | 词干提取（Stemming） | 词形还原（Lemmatization） |\n|------|---------------------|--------------------------|\n| **方法** | 启发式规则（去后缀） | 语言学知识（词汇+形态分析） |\n| **结果** | 不一定是有效单词 | 一定是词典中的有效单词 |\n| **速度** | 快 | 较慢 |\n| **典型工具** | NLTK PorterStemmer | NLTK WordNetLemmatizer |\n| **经典差异** | \"better\" → \"bet\" | \"better\" → \"good\" |\n\n#### Python代码示例（NLTK词形还原）\n```python\nfrom nltk.stem import WordNetLemmatizer\nimport nltk\nnltk.download('wordnet')\n\nlemmatizer = WordNetLemmatizer()\n\n# 词形还原需要指定词性（POS tag）\nprint(lemmatizer.lemmatize(\"running\", pos=\"v\"))  # → \"run\"\nprint(lemmatizer.lemmatize(\"better\", pos=\"a\"))    # → \"good\"\nprint(lemmatizer.lemmatize(\"children\"))            # → \"child\"\n```\n\n### 5.5 特殊字符处理\n\n#### 定义\n特殊字符、标点符号或符号（如 @、#、$、& 等）可能会给文本分析引入**干扰信息（Noise）**。根据具体任务需求，它们通常会被移除或妥善处理。\n\n#### 示例\n```\n\"Alex Yu is #1 scholar in Hawaii\"\n→ 移除#后：[\"Alex\", \"Yu\", \"1\", \"in\", \"Hawaii\"]\n```\n\n> ⚠️ **注意**：在某些情境中，特殊字符可能具有**特定含义**（如社交媒体中的话题标签 #hashtag、@mention），因此是否保留要**依据具体应用场景**来决定。\n\n### 5.6 其他预处理步骤\n\n#### 小写转换（Lower Casing）\n将所有文本转换为小写形式，确保格式统一，避免把\"Biology\"和\"biology\"当作不同的标记（Token）。\n\n#### 数字处理（Dealing with Numbers）\n数字既可以被移除，也可以用特定标记（如 `<NUM>`）替换。\n\n#### 缩写展开（Handling Contractions）\n缩写形式（如\"don't\"\"it's\"）通常会被展开为完整形式，以使文本标准化。\n```\n\"don't\" → \"do not\"\n\"it's\"  → \"it is\"\n```\n\n---\n\n## 第6章：停用词移除（Stop-word Removal）\n\n> **核心主题**：移除对分析无贡献的高频功能词，保留有信息量的内容词\n\n### 6.1 定义与原理\n\n#### 核心定义\n停用词（Stop Words）是在文本分析中被过滤掉的常见词，如\"a\"\"an\"\"the\"\"is\"\"am\"\"are\"\"however\"\"although\"\"but\"等。这些词在语言中频率很高，但对区分文档主题或内容几乎没有贡献。\n\n#### 移除停用词的意义\n- **减少数据维度**：降低特征空间大小\n- **提升计算效率**：减少不必要的处理量\n- **提高分析质量**：让模型更关注有信息量的词汇\n\n### 6.2 停用词的争议\n\n> ⚠️ **重要提醒**：停用词移除并非总是正确的选择。在某些情况下，停用词可能包含重要信息：\n> - \"To be or not to be\"（\"生存还是毁灭\"）—— 莎士比亚名句的核心含义恰好在停用词中\n> - \"但是\"可以**完全颠覆**句子的概念：\"房间很漂亮，**但**颜色不是我喜欢的\"\n> - BERT等现代模型已经能够利用上下文中的停用词信息进行理解\n\n---\n\n## 第7章：词频-逆文档频率（TF-IDF）\n\n> **核心主题**：将文本转化为数值特征的核心统计方法\n\n### 7.1 TF-IDF定义\n\nTF-IDF（Term Frequency-Inverse Document Frequency，词频-逆文档频率）是文本挖掘和信息检索中用于评估一个词对文档集合中某篇文档**重要性**的统计度量。\n\n- 某词在文档中的重要性与其在该文档中的**出现频率成正比**\n- 同时与该词在整个文档集合中的**出现频率成反比**\n\n#### 核心应用场景\n- 关键词提取\n- 文档相似度计算\n- 文本分类的特征工程\n- 搜索引擎排序\n\n### 7.2 公式详解\n\n#### 总公式\n```\nTF-IDF(t, d) = TF(t, d) × IDF(t, D)\n```\n其中：\n- t = 术语（Term），即某个词\n- d = 特定文档（Document）\n- D = 整个文档集合/语料库（Corpus）\n\n#### 词频 TF（Term Frequency）\n衡量某词 t 在文档 d 中的出现频率：\n\n```\nTF(t, d) = 词 t 在文档 d 中的出现次数 / 文档 d 的总词数\n```\n\n**计算示例**：\n> 文档内容：\"I ate an apple, which was a very delicious and satisfying snack for my busy day. What a great luxury.\"\n> - \"apple\"的出现次数 = 1\n> - 文档总词数 = 20\n> - TF(\"apple\") = 1/20 = **0.05**\n\n#### 逆文档频率 IDF（Inverse Document Frequency）\n衡量某词 t 在语料库所有文档中的**罕见程度**：\n\n```\nIDF(t, D) = log(文档集合 D 的总文档数 / 包含词 t 的文档数)\n```\n\n- 若词出现在所有文档中：分母 = 分子，log(1) = 0，IDF 值为 0\n- 若词出现在较少文档中：分母更小，IDF 值更高 → 该词更具信息量\n\n**计算示例**：\n> 语料库有 10,000,000 篇文档，\"apple\"出现在 1,000 篇中\n> IDF(\"apple\") = log(10,000,000 / 1,000) = log(10,000) = **4**\n\n#### TF-IDF得分计算\n```\nTF-IDF(\"apple\") = TF × IDF = 0.05 × 4 = 0.2\n```\n\n### 7.3 Python代码示例（TfidfVectorizer）\n\n```python\nfrom sklearn.feature_extraction.text import TfidfVectorizer\n\n# 定义语料库（5篇文档）\ndocuments = [\n    \"Text mining is extracting insights from text\",\n    \"Data mining discovers patterns from data\",\n    \"Natural language processing understands text\",\n    \"Machine learning builds predictive models\",\n    \"Text classification categorizes documents\"\n]\n\n# 创建TF-IDF向量化器（可选移除停用词）\nvectorizer = TfidfVectorizer(stop_words='english')\n\n# 拟合并转换文档 → 生成TF-IDF矩阵\ntfidf_matrix = vectorizer.fit_transform(documents)\n\n# 获取词汇表\nfeature_names = vectorizer.get_feature_names_out()\nprint(\"词汇表:\", feature_names)\n\n# 将稀疏矩阵转为密集矩阵以便查看\nimport pandas as pd\ndf = pd.DataFrame(tfidf_matrix.toarray(), columns=feature_names)\nprint(df)\n```\n\n#### 代码关键点说明\n| 组件 | 说明 |\n|------|------|\n| `TfidfVectorizer` | 自动完成分词、小写转换、停用词移除和TF-IDF计算 |\n| `fit_transform` | 将文档转换为TF-IDF矩阵，行=文档，列=词项 |\n| `get_feature_names_out()` | 获取词汇表（提取出的所有单词） |\n| `todense()` | 将稀疏矩阵转为密集矩阵，便于查看 |\n\n#### 输出结果解读\n- 像\"text\"\"mining\"\"extracting\"等词具有较高的非零TF-IDF分值\n- 像\"an\"\"but\"等常见词的分值为零（被当作停用词处理）\n- 分值体现了该词在整个文档集合语境中与对应文档的相关程度\n\n---\n\n## 第8章：N元语法（N-gram）\n\n> **核心主题**：捕捉词语序列关系的文本表示方法\n\n### 8.1 定义\nN-gram 是从文本中提取的**连续 n 个词（或字符）的序列**。它保留了词序信息，弥补了词袋模型（Bag of Words）丢失词序的缺陷。\n\n### 8.2 N-gram类型\n\n| 类型 | N值 | 示例（文本：\"I love text mining\"） |\n|------|-----|----------------------------------|\n| **Unigram** | 1 | [\"I\"], [\"love\"], [\"text\"], [\"mining\"] |\n| **Bigram** | 2 | [\"I love\"], [\"love text\"], [\"text mining\"] |\n| **Trigram** | 3 | [\"I love text\"], [\"love text mining\"] |\n\n### 8.3 应用场景\n- **语言建模**：预测下一个词的出现概率\n- **拼写检查**：基于N-gram频率判断合理搭配\n- **信息检索**：短语搜索比单词搜索更精确\n- **文本分类**：Bigram/Trigram可捕捉更有意义的特征组合\n- **机器翻译**：评估翻译结果的自然度\n\n> 💡 **选择建议**：N值越大，捕捉的上下文信息越丰富，但数据稀疏性也越高。实际应用中 **Bigram（N=2）** 和 **Trigram（N=3）** 最为常用。\n\n---\n\n## 第9章：词嵌入（Word Embedding）\n\n> **核心主题**：用密集向量表示词语语义关系的分布式表示方法\n\n### 9.1 词嵌入概述\n\n#### 核心定义\n词嵌入（Word Embedding）是一类将单词映射到**密集、低维度向量**的技术。与TF-IDF的稀疏高维表示不同，词嵌入能够**捕捉语义关系**——语义相似的词在向量空间中距离更近。\n\n#### 与TF-IDF的区别\n\n| 维度 | TF-IDF | 词嵌入（Word Embedding） |\n|------|--------|------------------------|\n| **表示方式** | 稀疏高维向量 | 密集低维向量 |\n| **语义信息** | 仅反映词频统计 | 捕捉语义相似性 |\n| **维度** | 等于词汇表大小 | 通常100-300维 |\n| **上下文** | 不考虑词序和语境 | 通过训练捕捉语境关系 |\n\n### 9.2 Word2Vec\n\n#### 核心思想\nWord2Vec 由 Google 于 2013 年提出，通过浅层神经网络学习词的分布式表示。有两种训练架构：\n\n| 架构 | 原理 | 适用场景 |\n|------|------|---------|\n| **CBOW**（连续词袋） | 根据上下文词预测目标词 | 较小数据集、较快训练 |\n| **Skip-gram**（跳字模型） | 根据目标词预测上下文词 | 较大数据集、稀有词表现更好 |\n\n#### Python代码示例\n```python\nfrom gensim.models import Word2Vec\n\n# 预处理：分词、转小写、去停用词和标点\nsentences = [\n    [\"artificial\", \"intelligence\", \"involves\", \"machine\", \"learning\"],\n    [\"deep\", \"learning\", \"is\", \"a\", \"subset\", \"of\", \"machine\", \"learning\"],\n    [\"natural\", \"language\", \"processing\", \"understands\", \"text\"],\n    [\"text\", \"mining\", \"extracts\", \"insights\", \"from\", \"data\"],\n    # ... 更多语料\n]\n\n# 训练Word2Vec模型（使用skip-gram）\nmodel = Word2Vec(sentences, vector_size=100, window=5, min_count=1, sg=1)\n\n# 查询与\"artificial\"最相似的词\nsimilar_words = model.wv.most_similar('artificial', topn=10)\nprint(\"与'artificial'最相似的词:\", similar_words)\n\n# 获取某个词的向量表示\nvector = model.wv['intelligence']\nprint(\"'intelligence'的向量维度:\", vector.shape)\n```\n\n#### 相似度分值解读\n| 分值范围 | 含义 |\n|---------|------|\n| 接近 **+1** | 高度相似，向量在嵌入空间中非常接近 |\n| 接近 **0** | 不太相似，不常出现在相似语境中 |\n| 接近 **-1** | 不相似，可能出现在对比或相反的语境中 |\n\n### 9.3 GloVe\n\n#### 核心思想\nGloVe（Global Vectors for Word Representation）由 Stanford 于 2014 年提出，结合了**全局语料统计**和**局部上下文窗口**的优势：\n- 不同于Word2Vec的局部窗口预测\n- 通过构建**共现矩阵**并进行矩阵分解来学习词向量\n- 在大规模语料上表现优异\n\n### 9.4 词嵌入的应用场景\n\n| 应用领域 | 具体任务 |\n|---------|---------|\n| **情感分析** | 通过词向量捕捉情感极性 |\n| **命名实体识别（NER）** | 利用语义相似性识别人名、地名等 |\n| **机器翻译** | 跨语言词向量对齐 |\n| **文本分类** | 作为深度学习模型的输入特征 |\n| **问答系统** | 基于语义相似度匹配问题和答案 |\n| **信息检索** | 语义搜索替代关键词搜索 |\n\n> 🔑 **Word2Vec vs GloVe 选择**：两者都能生成高质量词嵌入。选择通常取决于具体应用场景和数据集特征。Word2Vec更适合在线学习和小规模数据；GloVe在大规模预训练语料上通常表现更好。\n\n---\n\n## 全课程知识图谱\n\n```\n文本挖掘与非结构化数据\n│\n├── 数据基础层\n│   ├── 结构化数据 vs 非结构化数据\n│   ├── 文本/多媒体/IoT/Web数据\n│   └── 非结构化数据的处理流程\n│\n├── 技术方法层\n│   ├── NLP三大支柱：句法/语义/语用\n│   ├── LLM：Transformer + 预训练 + 微调\n│   ├── 文本挖掘：非结构化→结构化\n│   └── 文本预处理技术（Week 2 新增）\n│       ├── 分词（Tokenization）\n│       ├── 词干提取（Stemming）：Porter / Snowball / Lancaster\n│       ├── 词形还原（Lemmatization）\n│       ├── 停用词移除（Stop-word Removal）\n│       ├── 特殊字符处理\n│       ├── TF-IDF 向量化\n│       ├── N-gram 语法模型\n│       └── 词嵌入（Word2Vec / GloVe）\n│\n├── 应用实践层\n│   ├── 公共安全/医疗/金融/法律\n│   ├── 推荐系统/垃圾过滤/舆情监测\n│   └── 网络安全/文献检索\n│\n├── 历史发展层\n│   ├── 技术线：规则→统计→ML→DL→LLM\n│   └── 人文线：定性研究→Swanson→混合方法\n│\n└── 未来方向\n    ├── 可解释性\n    ├── 偏差减少\n    ├── 低能耗\n    └── 跨语言\n```\n\n## 与其他课程的关联\n\n| 关联课程 | 知识交叉点 |\n|---------|-----------|\n| **DSCI6000** 统计学 | 文本数据的统计建模、假设检验 |\n| **DSCI6100** Python | NLTK/spaCy文本处理、Python编程、gensim词嵌入 |\n| **DSCI6200** 机器学习 | SVM/LDA/Transformer等ML方法、TF-IDF特征工程、词嵌入输入 |\n| **DSCI6300** 数据可视化 | 文本可视化（词云、主题图、嵌入空间可视化） |\n| **DSCI6400** AI伦理 | 文本挖掘的隐私和偏见问题 |\n\n## 复习要点清单\n\n### Week 1 复习要点\n- [ ] 解释结构化数据与非结构化数据的核心区别\n- [ ] 描述NLP的三大语言学支柱（句法/语义/语用）\n- [ ] 说明Transformer架构的核心机制（自注意力）\n- [ ] 区分预训练和微调的区别\n- [ ] 列举文本挖掘在3个以上行业的应用\n- [ ] 梳理文本挖掘从1950年代至今的发展脉络\n- [ ] 解释Swanson的\"未被发现的公共知识\"概念\n\n### Week 2 复习要点\n- [ ] 说明文本预处理的完整流程及各步骤目的\n- [ ] 对比Porter、Snowball、Lancaster三种词干提取器的差异\n- [ ] 区分词干提取（Stemming）与词形还原（Lemmatization）的本质区别\n- [ ] 写出TF-IDF的完整公式并手动计算示例\n- [ ] 解释TF-IDF中\"逆文档频率\"的直觉含义\n- [ ] 列举TF-IDF的至少3种应用场景\n- [ ] 说明N-gram的定义及其与词袋模型的区别\n- [ ] 对比Word2Vec的CBOW和Skip-gram两种架构\n- [ ] 比较Word2Vec与GloVe的核心差异\n- [ ] 解释词嵌入相似度分值的含义（+1/0/-1）\n- [ ] 说明停用词移除的适用场景及其争议\n\n---\n\n> 📝 **学习方法建议**：选取一组非结构化数据（如产品评论），尝试用文本挖掘的完整流程处理：分词→去停用词→TF-IDF→主题建模，体验完整工作流。可以使用NLTK和scikit-learn库在Jupyter Notebook中实践。\n\n---\n\n> 本内容由 Coze AI 生成，请遵循相关法律法规及《人工智能生成合成内容标识办法》使用与传播。\n", "is_refined": true, "has_original": false}];

function setupSpy(){
const links=document.querySelectorAll('.nav-link');
// Simple scroll-based spy: check which section is at top of viewport on scroll
let ticking=false;
function updateSpy(){
  const secs=document.querySelectorAll('.content-section');
  const scrollY=window.scrollY+100;
  let currentId='';
  secs.forEach(s=>{
    if(s.offsetTop<=scrollY)currentId=s.id;
  });
  if(currentId){
    links.forEach(l=>l.classList.remove('active'));
    const a=document.querySelector(`.nav-link[data-target="${currentId}"]`);
    if(a){a.classList.add('active');
      // Scroll nav sidebar to show active link (no loop risk)
      const nav=document.querySelector('.sidebar-nav');
      if(nav){const r=a.getBoundingClientRect();const nr=nav.getBoundingClientRect();
        if(r.top<nr.top||r.bottom>nr.bottom)a.scrollIntoView({block:'nearest',behavior:'smooth'})}
    }
  }
  ticking=false;
}
window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(updateSpy)}},{passive:true});
